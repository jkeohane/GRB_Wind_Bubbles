# MCMC Parameter Configuriation File
name = 'StratifiedFireballModel'

#-------------- MODEL --------------
#---------------- E ----------------
[[model]]
name  = "E"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -2.0
    upper = 4.0
    initial_sigma = 2.12
    initial_guess = 0.25

#-------------- MODEL --------------
#----------- TRANSITION ------------
#--------------- nt ----------------
[[model]]
name  = "nt"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 6.0
    initial_sigma = -1.48
    initial_guess = 0.25

#-------------- MODEL --------------
#----------- TRANSITION ------------
#--------------- rt ----------------
[[model]]
name  = "rt"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = 15.0
    upper = 19.0
    initial_sigma = 18.0
    initial_guess = 0.50

#-------------- MODEL --------------
#-------------- eps_e --------------
[[model]]
name  = "eps_e"
