# MCMC Parameter Configuriation File
name = 'StratifiedFireballModel'

#-------------- MODEL --------------
#---------------- E ----------------
[[model]]
name  = "E"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -2.0
    upper = 4.0
    initial_guess = -0.4
    initial_sigma = 0.2

#-------------- MODEL --------------
#----------- TRANSITION ------------
#--------------- nt ----------------
[[model]]
name  = "nt"
scale = "log"

